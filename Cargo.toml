[package]
name = "mdbook-frontmatter-strip"
version = "1.1.2"
edition = "2024"
description = "mdBook preprocessor that strips YAML frontmatter from chapters"
license = "Apache-2.0"
repository = "https://github.com/saylesss88/mdbook-frontmatter-strip"
readme = "README.md"
keywords = ["mdbook", "frontmatter", "yaml", "preprocessor", "markdown"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = {version = "1.0.102", default-features = false}
serde_json = {version = "1.0.150", default-features = false, features = ["std"]}

[[bin]]
name = "mdbook-frontmatter-strip"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = {level = "warn", priority = -1}
future_incompatible = {level = "warn", priority = -1}
nonstandard_style = {level = "warn", priority = -1}

[lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[lints.clippy]
all = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
module_name_repetitions = "allow"
must_use_candidate = "allow"
todo = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
