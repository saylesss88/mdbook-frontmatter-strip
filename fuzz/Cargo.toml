[package]
name = "mdbook-frontmatter-strip-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = {version = "1", features = ["derive"]}

[dependencies.mdbook-frontmatter-strip]
path = ".."

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strip_frontmatter"
path = "fuzz_targets/strip_frontmatter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structured_strip"
path = "fuzz_targets/structured_strip.rs"
test = false
doc = false
bench = false
